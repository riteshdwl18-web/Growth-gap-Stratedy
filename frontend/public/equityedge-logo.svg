<svg xmlns="http://www.w3.org/2000/svg" width="980" height="980" viewBox="0 0 980 980" role="img" aria-labelledby="title desc">
  <title id="title">EquityEdge Logo</title>
  <desc id="desc">EquityEdge brand mark with growth arrow and wordmark.</desc>
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15386d" />
      <stop offset="100%" stop-color="#0d2550" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fcb36" />
      <stop offset="100%" stop-color="#2f9d3f" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="980" height="980" fill="#ffffff" />

  <path
    d="M272 170h372l-48 62H430c-52 0-94 42-94 94v91h220l-49 64H336v95h308l50 64H272V326c0-86 70-156 156-156z"
    fill="url(#navyGrad)"
  />

  <path
    d="M360 478l44-34v128h-44zm62-48l44-34v176h-44zm62-48l44-34v224h-44z"
    fill="url(#greenGrad)"
  />

  <path
    d="M254 560c128-12 235-55 321-129 35-30 66-63 96-106l55 31c-36 51-73 93-113 128-99 85-221 133-363 147z"
    fill="url(#greenGrad)"
    filter="url(#softGlow)"
  />

  <path d="M704 350l22-60 38 23z" fill="url(#greenGrad)" />

  <text x="116" y="760" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" fill="#112e5a">
    Equity
  </text>
  <text x="520" y="760" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" fill="#48aa35">
    Edge
  </text>

  <text x="118" y="844" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="4" fill="#15386d">
    INSIGHT. STRATEGY. GROWTH.
  </text>
  <text x="240" y="890" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="5" fill="#3a4f6f">
    SMART INVESTING. SHARP RESULTS.
  </text>
</svg>
